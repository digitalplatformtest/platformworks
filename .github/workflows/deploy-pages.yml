name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Stage the site
        # Publishing the whole repo means shipping ~47 MB of logo and video
        # assets on every run, and GitHub's ingest no longer accepts that
        # within the 10-minute deploy window (which is a hard maximum).
        # Ship only what the site actually serves.
        run: |
          mkdir -p _site
          cp .nojekyll index.html _site/
          cp -r assets _site/
          cp -r logos videos _site/
          cp -r pid-editor _site/
          cp metamodel-properties-mockup.html \
             properties-docking-mockup.html \
             properties-panel-mockup.html _site/
          du -sh _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # The site is ~49 MB of logo assets; GitHub's ingest regularly needs
          # more than the default 10 minutes. Wait up to 30 instead.
          timeout: 1800000
